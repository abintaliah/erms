s complete.&lt;/textarea&gt;&lt;div class=&quot;wm-help&quot;&gt;Rich text is sanitized when the message is sent.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;wm-inline-fields&quot;&gt;&lt;div class=&quot;wm-field&quot;&gt;&lt;label for=&quot;wm-priority&quot;&gt;Priority&lt;/label&gt;&lt;select class=&quot;wm-input&quot; id=&quot;wm-priority&quot;&gt;&lt;option&gt;Normal&lt;/option&gt;&lt;option selected&gt;High&lt;/option&gt;&lt;option&gt;Very high&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;div class=&quot;wm-field&quot;&gt;&lt;label for=&quot;wm-security&quot;&gt;Security level&lt;/label&gt;&lt;select class=&quot;wm-input&quot; id=&quot;wm-security&quot;&gt;&lt;option&gt;Public&lt;/option&gt;&lt;option&gt;Internal&lt;/option&gt;&lt;option selected&gt;Confidential&lt;/option&gt;&lt;option&gt;Secret&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;wm-inline-fields&quot;&gt;&lt;label class=&quot;wm-check&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;wm-action-required&quot; checked&gt;Action required&lt;/label&gt;&lt;label class=&quot;wm-check&quot;&gt;&lt;input type=&quot;checkbox&quot;&gt;Request read receipts&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;wm-field&quot; id=&quot;wm-due-field&quot;&gt;&lt;label for=&quot;wm-due&quot;&gt;Action due date &lt;span class=&quot;wm-help&quot;&gt;(optional)&lt;/span&gt;&lt;/label&gt;&lt;input class=&quot;wm-input&quot; type=&quot;date&quot; id=&quot;wm-due&quot; value=&quot;2026-10-08&quot;&gt;&lt;/div&gt;&lt;div class=&quot;wm-field&quot;&gt;&lt;span class=&quot;wm-field-label&quot;&gt;Linked Wathiq resources&lt;/span&gt;&lt;button class=&quot;wm-linked-resource&quot; type=&quot;button&quot;&gt;&lt;i data-lucide=&quot;folder&quot;&gt;&lt;/i&gt;&lt;span class=&quot;wm-resource-copy&quot;&gt;&lt;span class=&quot;wm-resource-title&quot;&gt;FY2026 Corporate File Plan&lt;/span&gt;&lt;span class=&quot;wm-resource-meta&quot;&gt;Confidential · permitted at the selected message level&lt;/span&gt;&lt;/span&gt;&lt;i data-lucide=&quot;x&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;wm-form-actions&quot;&gt;&lt;button class=&quot;wm-button&quot; type=&quot;button&quot; data-action=&quot;save-draft&quot;&gt;&lt;i data-lucide=&quot;save&quot;&gt;&lt;/i&gt;Save draft&lt;/button&gt;&lt;button class=&quot;wm-button primary&quot; type=&quot;submit&quot;&gt;&lt;i data-lucide=&quot;send&quot;&gt;&lt;/i&gt;Send&lt;/button&gt;&lt;/div&gt;&lt;/form&gt;&lt;aside class=&quot;wm-side&quot;&gt;&lt;div class=&quot;wm-card wm-panel&quot;&gt;&lt;h2&gt;Before sending&lt;/h2&gt;&lt;div class=&quot;wm-validation&quot;&gt;&lt;strong&gt;Recipients and linked resources are checked again when you send.&lt;/strong&gt;&lt;br&gt;The message content and fields become immutable after delivery.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;wm-card wm-panel&quot;&gt;&lt;h2&gt;Address expansion&lt;/h2&gt;&lt;div class=&quot;wm-panel-row&quot;&gt;&lt;span&gt;Direct users&lt;/span&gt;&lt;strong&gt;1&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;wm-panel-row&quot;&gt;&lt;span&gt;Expanded recipients&lt;/span&gt;&lt;strong&gt;1&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;wm-help&quot;&gt;Each recipient receives an individual mailbox copy.&lt;/div&gt;&lt;/div&gt;&lt;/aside&gt;&lt;/div&gt;
      &lt;/section&gt;

      &lt;nav class=&quot;wm-mobile-nav&quot; aria-label=&quot;Message navigation&quot;&gt;&lt;button class=&quot;active&quot; data-page=&quot;inbox&quot;&gt;&lt;i data-lucide=&quot;inbox&quot;&gt;&lt;/i&gt;Inbox&lt;/button&gt;&lt;button data-page=&quot;outbox&quot;&gt;&lt;i data-lucide=&quot;send&quot;&gt;&lt;/i&gt;Outbox&lt;/button&gt;&lt;button data-action=&quot;compose&quot;&gt;&lt;i data-lucide=&quot;square-pen&quot;&gt;&lt;/i&gt;Compose&lt;/button&gt;&lt;button data-page=&quot;drafts&quot;&gt;&lt;i data-lucide=&quot;file-pen-line&quot;&gt;&lt;/i&gt;Drafts&lt;/button&gt;&lt;/nav&gt;
    &lt;/main&gt;
  &lt;/div&gt;

  &lt;div class=&quot;wm-dialog-backdrop wm-hidden&quot; id=&quot;wm-recipient-dialog&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-labelledby=&quot;wm-recipient-title&quot;&gt;&lt;div class=&quot;wm-dialog&quot;&gt;&lt;div class=&quot;wm-dialog-head&quot;&gt;&lt;div&gt;&lt;h2 id=&quot;wm-recipient-title&quot;&gt;Add recipients&lt;/h2&gt;&lt;p&gt;Uses Wathiq’s shared user, role, and organization-unit selector&lt;/p&gt;&lt;/div&gt;&lt;button class=&quot;wm-icon-button&quot; data-close-dialog aria-label=&quot;Close&quot;&gt;&lt;i data-lucide=&quot;x&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;/div&gt;&lt;label class=&quot;wm-search&quot; style=&quot;max-width:none&quot;&gt;&lt;i data-lucide=&quot;search&quot;&gt;&lt;/i&gt;&lt;input value=&quot;records&quot; aria-label=&quot;Search recipients&quot;&gt;&lt;/label&gt;&lt;div class=&quot;wm-selector-panel&quot;&gt;&lt;button class=&quot;wm-selector-result&quot; data-select-recipient&gt;&lt;div class=&quot;wm-avatar&quot;&gt;RO&lt;/div&gt;&lt;span class=&quot;wm-selector-copy&quot;&gt;&lt;span class=&quot;wm-selector-title&quot;&gt;Records Officers&lt;/span&gt;&lt;span class=&quot;wm-selector-type&quot;&gt;Role · 12 eligible users&lt;/span&gt;&lt;/span&gt;&lt;i data-lucide=&quot;plus&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;button class=&quot;wm-selector-result&quot;&gt;&lt;div class=&quot;wm-avatar&quot;&gt;RM&lt;/div&gt;&lt;span class=&quot;wm-selector-copy&quot;&gt;&lt;span class=&quot;wm-selector-title&quot;&gt;Records Management Department&lt;/span&gt;&lt;span class=&quot;wm-selector-type&quot;&gt;Organization unit · 18 eligible users&lt;/span&gt;&lt;/span&gt;&lt;i data-lucide=&quot;plus&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;button class=&quot;wm-selector-result&quot; disabled&gt;&lt;div class=&quot;wm-avatar&quot;&gt;SR&lt;/div&gt;&lt;span class=&quot;wm-selector-copy&quot;&gt;&lt;span class=&quot;wm-selector-title&quot;&gt;Senior Reviewers&lt;/span&gt;&lt;span class=&quot;wm-selector-reason&quot;&gt;No active member has sufficient clearance for Confidential&lt;/span&gt;&lt;/span&gt;&lt;i data-lucide=&quot;circle-alert&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;wm-dialog-actions&quot;&gt;&lt;button class=&quot;wm-button&quot; data-close-dialog&gt;Cancel&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;wm-dialog-backdrop wm-hidden&quot; id=&quot;wm-reply-dialog&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-labelledby=&quot;wm-reply-title&quot;&gt;&lt;div class=&quot;wm-dialog&quot;&gt;&lt;div class=&quot;wm-dialog-head&quot;&gt;&lt;div&gt;&lt;h2 id=&quot;wm-reply-title&quot;&gt;Reply&lt;/h2&gt;&lt;p&gt;Linked to “Quarterly file plan review”; earlier content is not embedded.&lt;/p&gt;&lt;/div&gt;&lt;button class=&quot;wm-icon-button&quot; data-close-dialog aria-label=&quot;Close&quot;&gt;&lt;i data-lucide=&quot;x&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;wm-field&quot;&gt;&lt;label for=&quot;wm-reply-body&quot;&gt;Message&lt;/label&gt;&lt;textarea id=&quot;wm-reply-body&quot; class=&quot;wm-input&quot; rows=&quot;6&quot;&gt;I have reviewed the file plan. The mappings are correct.&lt;/textarea&gt;&lt;/div&gt;&lt;label class=&quot;wm-check&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;wm-action-done&quot;&gt;Is the action done?&lt;/label&gt;&lt;div class=&quot;wm-help&quot;&gt;This informs the original sender that your action is complete.&lt;/div&gt;&lt;div class=&quot;wm-dialog-actions&quot;&gt;&lt;button class=&quot;wm-button&quot; data-close-dialog&gt;Cancel&lt;/button&gt;&lt;button class=&quot;wm-button primary&quot; data-action=&quot;send-reply&quot;&gt;Send reply&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;wm-dialog-backdrop wm-hidden&quot; id=&quot;wm-amend-dialog&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-labelledby=&quot;wm-amend-title&quot;&gt;&lt;div class=&quot;wm-dialog&quot;&gt;&lt;div class=&quot;wm-dialog-head&quot;&gt;&lt;div&gt;&lt;h2 id=&quot;wm-amend-title&quot;&gt;Amend action&lt;/h2&gt;&lt;p&gt;The original message remains unchanged. Recipients receive an amendment notice.&lt;/p&gt;&lt;/div&gt;&lt;button class=&quot;wm-icon-button&quot; data-close-dialog aria-label=&quot;Close&quot;&gt;&lt;i data-lucide=&quot;x&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;wm-original-state&quot;&gt;&lt;strong&gt;Current effective state&lt;/strong&gt;Action required · due 6 October 2026 · 6 affected recipients&lt;/div&gt;&lt;div class=&quot;wm-field&quot; style=&quot;margin-top:14px&quot;&gt;&lt;label for=&quot;wm-amend-type&quot;&gt;Amendment&lt;/label&gt;&lt;select class=&quot;wm-input&quot; id=&quot;wm-amend-type&quot;&gt;&lt;option&gt;Change due date&lt;/option&gt;&lt;option&gt;Remove due date&lt;/option&gt;&lt;option&gt;Withdraw action requirement&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;div class=&quot;wm-field&quot; id=&quot;wm-amend-date-field&quot;&gt;&lt;label for=&quot;wm-amend-date&quot;&gt;New due date&lt;/label&gt;&lt;input class=&quot;wm-input&quot; type=&quot;date&quot; id=&quot;wm-amend-date&quot; value=&quot;2026-10-12&quot;&gt;&lt;/div&gt;&lt;div class=&quot;wm-field&quot;&gt;&lt;label for=&quot;wm-amend-reason&quot;&gt;Reason &lt;span aria-hidden=&quot;true&quot;&gt;*&lt;/span&gt;&lt;/label&gt;&lt;textarea class=&quot;wm-input&quot; id=&quot;wm-amend-reason&quot; rows=&quot;3&quot;&gt;Original date did not account for the public holiday.&lt;/textarea&gt;&lt;/div&gt;&lt;div class=&quot;wm-validation&quot;&gt;&lt;strong&gt;Result:&lt;/strong&gt; Outstanding recipients will be assessed against 12 October. Completed recipients will not be made late by this change.&lt;/div&gt;&lt;div class=&quot;wm-dialog-actions&quot;&gt;&lt;button class=&quot;wm-button&quot; data-close-dialog&gt;Cancel&lt;/button&gt;&lt;button class=&quot;wm-button primary&quot; data-action=&quot;confirm-amend&quot;&gt;Confirm amendment&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;wm-dialog-backdrop wm-hidden&quot; id=&quot;wm-info-dialog&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot;&gt;&lt;div class=&quot;wm-dialog&quot;&gt;&lt;div class=&quot;wm-dialog-head&quot;&gt;&lt;div&gt;&lt;h2&gt;Restricted message&lt;/h2&gt;&lt;p&gt;This delivery remains visible without disclosing protected information.&lt;/p&gt;&lt;/div&gt;&lt;button class=&quot;wm-icon-button&quot; data-close-dialog aria-label=&quot;Close&quot;&gt;&lt;i data-lucide=&quot;x&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;wm-validation&quot;&gt;Your current security clearance no longer permits access to this message. Contact your administrator if you believe your access should be restored.&lt;/div&gt;&lt;div class=&quot;wm-dialog-actions&quot;&gt;&lt;button class=&quot;wm-button primary&quot; data-close-dialog&gt;Close&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;wm-toast wm-hidden&quot; id=&quot;wm-toast&quot; role=&quot;status&quot;&gt;&lt;i data-lucide=&quot;mail&quot;&gt;&lt;/i&gt;&lt;div class=&quot;wm-toast-copy&quot;&gt;&lt;div class=&quot;wm-toast-title&quot;&gt;New message from Aisha Al Suwaidi&lt;/div&gt;&lt;div class=&quot;wm-toast-body&quot;&gt;Records transfer confirmation · High priority&lt;/div&gt;&lt;div class=&quot;wm-toast-actions&quot;&gt;&lt;button data-action=&quot;open-toast&quot;&gt;Open message&lt;/button&gt;&lt;button data-action=&quot;dismiss-toast&quot;&gt;Dismiss&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;wathiq-messaging-mockup&#x27;);
  const pages = [...root.querySelectorAll(&#x27;[data-view]&#x27;)];
  const dialogs = [...root.querySelectorAll(&#x27;.wm-dialog-backdrop&#x27;)];
  let lastMailbox = &#x27;inbox&#x27;;

  function showPage(name) {
    pages.forEach(page =&gt; page.classList.toggle(&#x27;wm-hidden&#x27;, page.dataset.view !== name));
    root.querySelectorAll(&#x27;[data-page]&#x27;).forEach(button =&gt; button.classList.toggle(&#x27;active&#x27;, button.dataset.page === name));
    if ([&#x27;inbox&#x27;, &#x27;outbox&#x27;, &#x27;drafts&#x27;].includes(name)) lastMailbox = name;
    root.querySelector(&#x27;.wm-main&#x27;).scrollTop = 0;
  }
  function openDialog(id) { dialogs.forEach(dialog =&gt; dialog.classList.add(&#x27;wm-hidden&#x27;)); root.querySelector(id).classList.remove(&#x27;wm-hidden&#x27;); }
  function closeDialogs() { dialogs.forEach(dialog =&gt; dialog.classList.add(&#x27;wm-hidden&#x27;)); }
  function showToast(title, body) {
    const toast = root.querySelector(&#x27;#wm-toast&#x27;);
    toast.querySelector(&#x27;.wm-toast-title&#x27;).textContent = title;
    toast.querySelector(&#x27;.wm-toast-body&#x27;).textContent = body;
    toast.classList.remove(&#x27;wm-hidden&#x27;);
  }
  function prepareCompose(kind) {
    showPage(&#x27;compose&#x27;);
    const title = root.querySelector(&#x27;#wm-compose-title&#x27;);
    const subtitle = root.querySelector(&#x27;#wm-compose-subtitle&#x27;);
    const crumb = root.querySelector(&#x27;#wm-compose-crumb&#x27;);
    if (kind === &#x27;forward&#x27;) { title.textContent = &#x27;Forward message&#x27;; subtitle.textContent = &#x27;Linked to the earlier message; its content and recipients are not copied&#x27;; crumb.textContent = &#x27;Forward&#x27;; }
    else if (kind === &#x27;follow-up&#x27;) { title.textContent = &#x27;Send follow-up&#x27;; subtitle.textContent = &#x27;Linked to your earlier sent message; choose a new recipient list&#x27;; crumb.textContent = &#x27;Follow-up&#x27;; }
    else if (kind === &#x27;draft&#x27;) { title.textContent = &#x27;Edit draft&#x27;; subtitle.textContent = &#x27;This message has not been sent&#x27;; crumb.textContent = &#x27;Draft&#x27;; }
    else { title.textContent = &#x27;New message&#x27;; subtitle.textContent = &#x27;Compose a secure in-app message&#x27;; crumb.textContent = &#x27;Compose&#x27;; }
  }

  root.addEventListener(&#x27;click&#x27;, event =&gt; {
    const pageButton = event.target.closest(&#x27;[data-page]&#x27;);
    if (pageButton) { showPage(pageButton.dataset.page); return; }
    const message = event.target.closest(&#x27;[data-message]&#x27;);
    if (message) {
      const type = message.dataset.message;
      if (type === &#x27;restricted&#x27;) openDialog(&#x27;#wm-info-dialog&#x27;);
      else if (type.startsWith(&#x27;outbox&#x27;)) showPage(&#x27;outbox-detail&#x27;);
      else if (type === &#x27;quarterly&#x27; || type === &#x27;amendment&#x27;) showPage(&#x27;detail&#x27;);
      else showToast(&#x27;Message opened&#x27;, message.querySelector(&#x27;.wm-subject&#x27;).textContent.trim());
      return;
    }
    const actionButton = event.target.closest(&#x27;[data-action]&#x27;);
    if (!actionButton) return;
    const action = actionButton.dataset.action;
    if (action === &#x27;compose&#x27;) prepareCompose(&#x27;new&#x27;);
    if (action === &#x27;forward&#x27;) prepareCompose(&#x27;forward&#x27;);
    if (action === &#x27;follow-up&#x27;) prepareCompose(&#x27;follow-up&#x27;);
    if (action === &#x27;edit-draft&#x27;) prepareCompose(&#x27;draft&#x27;);
    if (action === &#x27;reply&#x27;) openDialog(&#x27;#wm-reply-dialog&#x27;);
    if (action === &#x27;amend&#x27;) openDialog(&#x27;#wm-amend-dialog&#x27;);
    if (action === &#x27;back&#x27;) showPage(&#x27;inbox&#x27;);
    if (action === &#x27;outbox&#x27;) showPage(&#x27;outbox&#x27;);
    if (action === &#x27;back-from-compose&#x27;) showPage(lastMailbox);
    if (action === &#x27;add-recipient&#x27;) openDialog(&#x27;#wm-recipient-dialog&#x27;);
    if (action === &#x27;send-reply&#x27;) { closeDialogs(); showToast(&#x27;Reply sent&#x27;, root.querySelector(&#x27;#wm-action-done&#x27;).checked ? &#x27;The sender was informed that the action is complete.&#x27; : &#x27;Your reply has been delivered.&#x27;); }
    if (action === &#x27;confirm-amend&#x27;) { closeDialogs(); showToast(&#x27;Action amended&#x27;, &#x27;Recipients were notified of the new due date.&#x27;); }
    if (action === &#x27;save-draft&#x27;) { showToast(&#x27;Draft saved&#x27;, &#x27;You can continue editing it from Drafts.&#x27;); }
    if (action === &#x27;recent&#x27;) { showToast(&#x27;Recently deleted&#x27;, &#x27;No recoverable messages in this mockup.&#x27;); }
    if (action === &#x27;resource&#x27;) { showToast(&#x27;Resource authorization checked&#x27;, &#x27;The linked aggregation is available in view-only mode.&#x27;); }
    if (action === &#x27;dismiss-toast&#x27;) root.querySelector(&#x27;#wm-toast&#x27;).classList.add(&#x27;wm-hidden&#x27;);
    if (action === &#x27;open-toast&#x27;) { root.querySelector(&#x27;#wm-toast&#x27;).classList.add(&#x27;wm-hidden&#x27;); showPage(&#x27;inbox&#x27;); }
  });
  root.querySelectorAll(&#x27;[data-close-dialog]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, closeDialogs));
  root.querySelector(&#x27;#wm-demo-toast&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; showToast(&#x27;New message from Aisha Al Suwaidi&#x27;,&#x27;Records transfer confirmation · High priority&#x27;));
  root.querySelector(&#x27;[data-select-recipient]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    const box = root.querySelector(&#x27;#wm-to-box&#x27;);
    if (!box.textContent.includes(&#x27;Records Officers&#x27;)) {
      const chip = document.createElement(&#x27;span&#x27;); chip.className = &#x27;wm-chip&#x27;; chip.textContent = &#x27;Records Officers (12) &#x27;;
      const remove = document.createElement(&#x27;button&#x27;); remove.type = &#x27;button&#x27;; remove.setAttribute(&#x27;aria-label&#x27;,&#x27;Remove Records Officers&#x27;); remove.innerHTML = &#x27;&lt;i data-lucide=&quot;x&quot;&gt;&lt;/i&gt;&#x27;; remove.addEventListener(&#x27;click&#x27;, () =&gt; chip.remove()); chip.appendChild(remove); box.insertBefore(chip, box.lastElementChild);
      if (globalThis.lucide) lucide.createIcons({attrs:{width:16,height:16}});
    }
    closeDialogs();
  });
  root.querySelector(&#x27;#wm-action-required&#x27;).addEventListener(&#x27;change&#x27;, event =&gt; root.querySelector(&#x27;#wm-due-field&#x27;).classList.toggle(&#x27;wm-hidden&#x27;, !event.target.checked));
  root.querySelector(&#x27;#wm-amend-type&#x27;).addEventListener(&#x27;change&#x27;, event =&gt; root.querySelector(&#x27;#wm-amend-date-field&#x27;).classList.toggle(&#x27;wm-hidden&#x27;, event.target.value !== &#x27;Change due date&#x27;));
  root.querySelector(&#x27;#wm-compose-form&#x27;).addEventListener(&#x27;submit&#x27;, event =&gt; { event.preventDefault(); showPage(&#x27;outbox&#x27;); showToast(&#x27;Message sent&#x27;,&#x27;1 envelope created and recipient copies queued for delivery.&#x27;); });
  root.querySelector(&#x27;#wm-inbox-search&#x27;).addEventListener(&#x27;input&#x27;, event =&gt; { const q=event.target.value.toLowerCase(); root.querySelectorAll(&#x27;#wm-inbox-list .wm-message-row&#x27;).forEach(row =&gt; row.classList.toggle(&#x27;wm-hidden&#x27;, !row.textContent.toLowerCase().includes(q))); });
})();

        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
